name: full-row-audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run full NSE-750 row audit
        run: python scripts/full_row_audit.py

      - name: Publish audit summary
        if: always()
        run: cat audit_output/full_nse750_row_audit_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-nse750-row-audit
          path: audit_output/
          retention-days: 7
