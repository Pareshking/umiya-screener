name: scheduled-data-refresh

on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Build canonical 10-year dataset
        run: python scripts/build_data.py

      - name: Build screener metrics
        run: python scripts/build_metrics.py

      - name: Validate generated datasets
        run: python -m pytest tests -q

      - name: Find latest datasets
        id: datasets
        shell: bash
        run: |
          PRICE_PATH="$(python - <<'PY'
          from pathlib import Path
          import json
          root=Path('data_cache/price_history')
          name=json.loads((root/'LATEST.json').read_text())['dataset']
          print(root/name)
          PY
          )"
          METRICS_PATH="$(python - <<'PY'
          from pathlib import Path
          import json
          root=Path('data_cache/metrics')
          name=json.loads((root/'LATEST.json').read_text())['dataset']
          print(root/name)
          PY
          )"
          echo "price_path=$PRICE_PATH" >> "$GITHUB_OUTPUT"
          echo "metrics_path=$METRICS_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish immutable datasets to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PRICE_PATH: ${{ steps.datasets.outputs.price_path }}
          METRICS_PATH: ${{ steps.datasets.outputs.metrics_path }}
        run: |
          test -n "$R2_ACCOUNT_ID" || (echo "Missing R2_ACCOUNT_ID secret" && exit 1)
          test -n "$R2_ACCESS_KEY_ID" || (echo "Missing R2_ACCESS_KEY_ID secret" && exit 1)
          test -n "$R2_SECRET_ACCESS_KEY" || (echo "Missing R2_SECRET_ACCESS_KEY secret" && exit 1)
          test -n "$R2_BUCKET" || (echo "Missing R2_BUCKET secret" && exit 1)
          export S3_ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export S3_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export S3_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export S3_BUCKET="$R2_BUCKET"
          export S3_REGION="auto"
          python scripts/publish_r2.py --dataset "$PRICE_PATH" --prefix "datasets/$(basename "$PRICE_PATH")" --pointer "pointers/latest-price-dataset.json"
          python scripts/publish_r2.py --dataset "$METRICS_PATH" --prefix "metrics/$(basename "$METRICS_PATH")" --pointer "pointers/latest-metrics-dataset.json"
