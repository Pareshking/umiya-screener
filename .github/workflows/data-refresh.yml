name: scheduled-data-refresh

on:
  schedule:
    # 01:30 UTC = 07:00 IST, every day.
    #
    # Morning-after, not same-evening: the run reports on the previous
    # session, which closed at 15:30 IST, so it reads fully settled data.
    #
    # EVERY day, not weekdays. A Mon-Fri schedule left a 72h gap across the
    # weekend against a metrics TTL of 36h, so the API served 503 from Saturday
    # evening until Monday's build. Weekend runs republish the same last trading
    # day with a fresh built_at, which is what keeps the dataset servable.
    # tests/test_refresh_schedule.py pins both properties.
    - cron: "30 1 * * *"
    # 04:30 UTC = 10:00 IST. A retry, not a second report.
    #
    # GitHub drops scheduled runs under load and documents that it may. This
    # repository has actually seen it: the 01:30 slot was missed on 5 and 7
    # September 2026 and ran 5h late on the 6th, and the 15:00 watchdog slot
    # ran 2.5h late. One cron is therefore not a schedule, it is a hope. The
    # retry skips itself when the primary run already published today, so on a
    # normal day this costs nothing and pulls nothing extra from the upstream.
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-data-refresh
  cancel-in-progress: false

jobs:
  decide:
    # Is a build actually needed, or did an earlier slot already publish today?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - name: Check whether today already has a published dataset
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import json
          import os
          import urllib.request

          # A manual dispatch always builds: someone asked for it on purpose.
          if os.environ.get("EVENT_NAME") != "schedule":
              print("needed=true")
              raise SystemExit(0)

          # Fail open. If we cannot tell what production is serving, build --
          # a wasted build costs three minutes, a skipped one costs a day.
          try:
              with urllib.request.urlopen(
                  "https://umiya-screener-api.onrender.com/api/v1/ready", timeout=120
              ) as response:
                  payload = json.load(response)
              built_at = dt.datetime.fromisoformat(payload["built_at"])
              today = dt.datetime.now(dt.timezone.utc).date()
              fresh = built_at.astimezone(dt.timezone.utc).date() == today
          except Exception:                                 # noqa: BLE001
              print("needed=true")
              raise SystemExit(0)

          print("needed=false" if fresh else "needed=true")
          PY

  refresh:
    needs: decide
    if: needs.decide.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest httpx

      - name: Build canonical 10-year dataset
        run: python scripts/build_data.py

      - name: Build screener metrics
        run: python scripts/build_metrics.py

      - name: Audit canonical momentum rows
        run: python scripts/audit_momentum_data.py | tee momentum_audit.json

      - name: Publish audit report to workflow summary
        shell: bash
        run: |
          echo '## Momentum data audit' >> "$GITHUB_STEP_SUMMARY"
          echo 'Read-only audit of the canonical dataset used by the metrics build.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat momentum_audit.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate generated datasets
        run: python -m pytest tests -q

      - name: Find latest datasets
        id: datasets
        shell: bash
        run: |
          PRICE_PATH="$(python - <<'PY'
          from pathlib import Path
          import json
          root=Path('data_cache/price_history')
          name=json.loads((root/'LATEST.json').read_text())['dataset']
          print(root/name)
          PY
          )"
          METRICS_PATH="$(python - <<'PY'
          from pathlib import Path
          import json
          root=Path('data_cache/metrics')
          name=json.loads((root/'LATEST.json').read_text())['dataset']
          print(root/name)
          PY
          )"
          echo "price_path=$PRICE_PATH" >> "$GITHUB_OUTPUT"
          echo "metrics_path=$METRICS_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish immutable datasets to R2
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          PRICE_PATH: ${{ steps.datasets.outputs.price_path }}
          METRICS_PATH: ${{ steps.datasets.outputs.metrics_path }}
        run: |
          test -n "$S3_ENDPOINT_URL" || (echo "Missing S3_ENDPOINT_URL secret" && exit 1)
          test -n "$S3_ACCESS_KEY_ID" || (echo "Missing S3_ACCESS_KEY_ID secret" && exit 1)
          test -n "$S3_SECRET_ACCESS_KEY" || (echo "Missing S3_SECRET_ACCESS_KEY secret" && exit 1)
          test -n "$S3_BUCKET" || (echo "Missing S3_BUCKET secret" && exit 1)
          export S3_REGION="auto"
          python scripts/publish_r2.py --dataset "$PRICE_PATH" --prefix "datasets/$(basename "$PRICE_PATH")" --pointer "pointers/latest-price-dataset.json"
          python scripts/publish_r2.py --dataset "$METRICS_PATH" --prefix "metrics/$(basename "$METRICS_PATH")" --pointer "pointers/latest-metrics-dataset.json"

      - name: Smoke production readiness after publication
        shell: bash
        env:
          METRICS_PATH: ${{ steps.datasets.outputs.metrics_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request

          # WAIT FOR THE PUBLISHED BUILD, NOT MERELY FOR "A" BUILD.
          #
          # This asserted only dataset_ready, which stays true while the API
          # serves an OLDER dataset -- so it could not detect the very failure
          # it was added to catch. On 2026-09-07 it passed while production
          # went on serving the previous day's build, and the refresh was green
          # for it. Comparing against the built_at we just published is what
          # makes this check mean "the new numbers are live".
          import datetime as _dt

          def _parse(value: str) -> _dt.datetime:
              parsed = _dt.datetime.fromisoformat(value)
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=_dt.timezone.utc)
              return parsed

          published_at = _parse(
              json.loads(
                  (pathlib.Path(os.environ["METRICS_PATH"]) / "metadata.json").read_text()
              )["built_at_utc"]
          )
          print(f"published build: {published_at.isoformat()}")

          # Give the running service time to notice the new pointer.
          #
          # This used to fire one second after the R2 upload and fail the whole
          # refresh on the 503 it inevitably got. That turned every successful
          # publish into a red build, which is how a genuine outage went
          # unnoticed: the job was always red anyway. The API is also cold-start
          # prone, so the first request can take the better part of a minute.
          base = "https://umiya-screener-api.onrender.com"
          deadline = time.monotonic() + 600

          def get(path):
              with urllib.request.urlopen(base + path, timeout=120) as response:
                  return response.status, json.load(response)

          attempt = 0
          while True:
              attempt += 1
              try:
                  status, payload = get("/api/v1/ready")
                  if status == 200 and payload.get("dataset_ready") is True:
                      serving = payload.get("built_at")
                      if serving and _parse(serving) >= published_at:
                          print(f"serving the published build after {attempt} attempt(s): "
                                f"{json.dumps(payload, separators=(',', ':'))[:400]}")
                          break
                      detail = (f"ready but still serving {serving}, "
                                f"published {published_at.isoformat()}")
                  else:
                      detail = f"HTTP {status}"
              except urllib.error.HTTPError as exc:
                  detail = f"HTTP {exc.code}"
              except Exception as exc:                      # noqa: BLE001
                  detail = f"{type(exc).__name__}: {exc}"

              if time.monotonic() >= deadline:
                  raise SystemExit(
                      f"service never became ready after publication ({detail}). "
                      "The dataset is in R2; the API is not serving it."
                  )
              print(f"  attempt {attempt}: {detail}; retrying")
              time.sleep(20)

          for path in ("/api/v1/live", "/api/v1/screener/metadata"):
              status, payload = get(path)
              if status != 200:
                  raise SystemExit(f"{path}: unexpected HTTP {status}")
              print(path, json.dumps(payload, separators=(",", ":"))[:600])
          PY
