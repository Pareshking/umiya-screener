name: Yahoo row audit 2

on:
  push:
    branches: [analysis/yahoo-row-audit2]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: pip install --disable-pip-version-check yfinance pandas numpy requests
      - name: Full 750-stock V1 vs V2 audit
        run: |
          cat > /tmp/audit.py <<'PY'
          import json
          import numpy as np
          import pandas as pd
          import yfinance as yf
          from src.data import load_universe
          universe = load_universe()
          symbols = universe['Symbol'].astype(str).str.upper().tolist()
          print('UNIVERSE', len(symbols))
          tickers=[s+'.NS' for s in symbols]
          raw=yf.download(tickers,period='2y',auto_adjust=False,actions=False,progress=False,group_by='column',threads=True)
          close=raw['Close'].copy(); adj=raw['Adj Close'].copy()
          close.columns=[str(c).replace('.NS','').upper() for c in close.columns]
          adj.columns=[str(c).replace('.NS','').upper() for c in adj.columns]
          close=close.reindex(columns=symbols).sort_index(); adj=adj.reindex(columns=symbols).sort_index()
          def v1_clean(p):
              threshold=max(int(p.shape[1]*.70),1)
              return p.loc[p.isna().sum(axis=1)<=threshold].copy().ffill()
          def v2_clean(p):
              out=p.copy(); out.index=pd.to_datetime(out.index).tz_localize(None); return out.sort_index()
          v1=v1_clean(close); v2=v2_clean(adj)
          windows=(21,63,126,189,252); weights=(.10,.30,.30,.20,.10)
          def r2(p,w,minp):
              lp=np.log(p.where(p>0)); t=pd.Series(np.arange(len(lp),dtype=float),index=lp.index)
              return lp.rolling(w,min_periods=minp).corr(t)**2
          def sr2(p,w,v1mode):
              lr=np.log(p/p.shift(1).replace(0,np.nan)); ch=np.log(p/p.shift(w).replace(0,np.nan))
              minp=max(int(w*.8),10) if v1mode else w
              vol=lr.rolling(w,min_periods=minp).std()*np.sqrt(w)
              return (ch/vol.replace(0,np.nan))*r2(p,w,minp)
          def components(p,v1mode):
              valid=p.notna().sum(); out={}
              for w in windows:
                  raw=sr2(p,w,v1mode); raw.loc[:,valid<w]=np.nan
                  mean=raw.mean(axis=1); std=raw.std(axis=1).replace(0,np.nan)
                  z=raw.sub(mean,axis=0).div(std,axis=0).clip(-3,3)
                  out[w]=(raw.iloc[-1],z.iloc[-1])
              return out
          c1=components(v1,True); c2=components(v2,False)
          scores={}
          for label,c in [('V1',c1),('V2',c2)]:
              s=pd.Series(0.0,index=symbols)
              for w,wt in zip(windows,weights): s=s.add(c[w][1].fillna(0)*wt)
              scores[label]=s
          cmp=pd.DataFrame({'V1_score':scores['V1'],'V2_score':scores['V2']})
          cmp['V1_rank']=cmp.V1_score.rank(ascending=False,method='min'); cmp['V2_rank']=cmp.V2_score.rank(ascending=False,method='min')
          cmp['rank_delta']=cmp.V2_rank-cmp.V1_rank; cmp['score_delta']=cmp.V2_score-cmp.V1_score
          cmp.to_csv('full_rank_comparison.csv')
          print('\nTOP V1\n',cmp.sort_values('V1_rank').head(20).to_string())
          print('\nTOP V2\n',cmp.sort_values('V2_rank').head(20).to_string())
          print('\nCUPID\n',cmp.loc['CUPID'].to_string())
          detail=[]
          for label,c in [('V1',c1),('V2',c2)]:
              for w,wt in zip(windows,weights):
                  detail.append({'system':label,'window':w,'raw':c[w][0].get('CUPID',np.nan),'z':c[w][1].get('CUPID',np.nan),'weighted':c[w][1].get('CUPID',np.nan)*wt})
          pd.DataFrame(detail).to_csv('cupid_component_comparison.csv',index=False)
          five=['CUPID','STLTECH','LAURUSLABS','ATHERENERG','RRKABEL']; rows=[]
          for s in five:
              a=v1[s].dropna(); b=v2[s].dropna()
              for w in windows:
                  rows.append({'symbol':s,'window':w,'v1_start_date':a.index[-w-1].date(),'v2_start_date':b.index[-w-1].date(),'v1_start_price':a.iloc[-w-1],'v2_start_price':b.iloc[-w-1],'v1_return':a.iloc[-1]/a.iloc[-w-1]-1,'v2_return':b.iloc[-1]/b.iloc[-w-1]-1})
          pd.DataFrame(rows).to_csv('five_row_comparison.csv',index=False)
          with open('audit_summary.json','w') as f: json.dump({'universe':len(symbols),'v1_valid':int(cmp.V1_score.notna().sum()),'v2_valid':int(cmp.V2_score.notna().sum()),'cupid':cmp.loc['CUPID'].to_dict()},f,default=str,indent=2)
          PY
          python /tmp/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: yahoo-row-audit-full
          path: |
            full_rank_comparison.csv
            cupid_component_comparison.csv
            five_row_comparison.csv
            audit_summary.json
