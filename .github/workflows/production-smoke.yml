name: production-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every day, and twice: a watchdog that sleeps at weekends is not a
    # watchdog. The screener was down for hours on a Sunday with nothing
    # reporting it, because this only ran Mon-Fri. The 03:00 run is ~90 min
    # after the data refresh, so a refresh that fails or never fires is caught
    # the same morning rather than on Monday.
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install smoke-test dependency
        run: python -m pip install --disable-pip-version-check httpx
      - name: Run production smoke and latency audit
        env:
          PRODUCTION_API_URL: https://umiya-screener-api.onrender.com
          PRODUCTION_FRONTEND_URL: https://pareshpatel.vercel.app
        run: python scripts/production_smoke.py
