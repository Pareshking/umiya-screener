name: validation

on:
  push:
    branches: [main, "test/full-history-adjclose-volume-20260816", "phase3-api-frontend-20260816"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
      - name: Test 10-year Yahoo history — Adj Close + Volume
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          import yfinance as yf
          from src.data import _ten_year_window, load_universe

          out = Path("data_cache/yahoo_10y_history_test")
          out.mkdir(parents=True, exist_ok=True)
          start, end = _ten_year_window()
          universe = load_universe()
          symbols = universe["Symbol"].dropna().astype(str).str.upper().drop_duplicates().tolist()
          if len(symbols) != 750:
              raise RuntimeError(f"Expected 750 universe symbols, got {len(symbols)}")
          tickers = [f"{s}.NS" for s in symbols]
          print(f"Universe symbols: {len(symbols)}")
          print(f"Exact Yahoo window: {start} through {end} (end exclusive)")
          raw = yf.download(tickers, start=start, end=end, auto_adjust=False, actions=False, progress=True, group_by="column", threads=True)
          if raw.empty:
              raise RuntimeError("Yahoo returned an empty dataset")
          if not isinstance(raw.columns, pd.MultiIndex):
              raise RuntimeError(f"Expected MultiIndex output, got {type(raw.columns)}")
          fields = set(raw.columns.get_level_values(0))
          required = {"Adj Close", "Volume"}
          if required - fields:
              raise RuntimeError(f"Missing fields: {sorted(required - fields)}")
          adj = raw["Adj Close"].copy()
          vol = raw["Volume"].copy()
          adj.columns = [str(c).replace(".NS", "").upper() for c in adj.columns]
          vol.columns = [str(c).replace(".NS", "").upper() for c in vol.columns]
          adj = adj.reindex(columns=symbols)
          vol = vol.reindex(columns=symbols)
          adj.index = pd.to_datetime(adj.index).tz_localize(None)
          vol.index = pd.to_datetime(vol.index).tz_localize(None)
          if adj.index.min() < pd.Timestamp(start):
              raise RuntimeError("Yahoo returned data before the requested 10-year start date")
          report = pd.DataFrame({
              "AdjCloseDays": adj.notna().sum(),
              "VolumeDays": vol.notna().sum(),
              "FirstAdjClose": adj.apply(lambda s: s.dropna().index.min() if s.notna().any() else pd.NaT),
              "LastAdjClose": adj.apply(lambda s: s.dropna().index.max() if s.notna().any() else pd.NaT),
              "AdjCloseMissingPct": adj.isna().mean().mul(100),
              "VolumeMissingPct": vol.isna().mean().mul(100),
              "ZeroVolumeDays": vol.fillna(0).eq(0).sum(),
          })
          report.index.name = "Symbol"
          report.to_csv(out / "symbol_report.csv")
          adj.to_parquet(out / "adj_close.parquet")
          vol.to_parquet(out / "volume.parquet")
          summary = {
              "start": start,
              "end_exclusive": end,
              "universe_symbols": len(symbols),
              "yahoo_columns": len(adj.columns),
              "date_rows": len(adj.index),
              "first_date": str(adj.index.min().date()),
              "last_date": str(adj.index.max().date()),
              "symbols_with_adj_close": int(adj.notna().any().sum()),
              "symbols_with_volume": int(vol.notna().any().sum()),
              "symbols_ge_126_adj_close": int((adj.notna().sum() >= 126).sum()),
              "symbols_ge_126_volume": int((vol.notna().sum() >= 126).sum()),
              "adj_close_missing_cells": int(adj.isna().sum().sum()),
              "volume_missing_cells": int(vol.isna().sum().sum()),
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY
      - name: Validate Phase 2 metrics against the real 750-stock dataset
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from src.data import load_universe
          from backend.app import service

          src = Path("data_cache/yahoo_10y_history_test")
          target = Path("data_cache/price_history/ci_phase2")
          target.mkdir(parents=True, exist_ok=True)
          adj = pd.read_parquet(src / "adj_close.parquet")
          vol = pd.read_parquet(src / "volume.parquet")
          universe = load_universe().drop_duplicates("Symbol").copy()
          symbols = universe["Symbol"].astype(str).str.upper().tolist()
          adj = adj.reindex(columns=symbols)
          vol = vol.reindex(columns=symbols)
          as_of = adj.index.max()
          eligibility = pd.DataFrame({
              "Symbol": symbols,
              "Last Price Date": [adj[s].dropna().index.max() if adj[s].notna().any() else pd.NaT for s in symbols],
              "Data Age Days": [int((as_of - adj[s].dropna().index.max()).days) if adj[s].notna().any() else 9999 for s in symbols],
          })
          adj.to_parquet(target / "adj_close.parquet")
          vol.to_parquet(target / "volume.parquet")
          eligibility.to_parquet(target / "eligibility.parquet", index=False)
          universe.to_parquet(target / "universe.parquet", index=False)
          (target / "metadata.json").write_text(json.dumps({"market_as_of": str(as_of.date()), "schema_version": "1.1"}), encoding="utf-8")
          (Path("data_cache/price_history") / "LATEST.json").write_text(json.dumps({"dataset": "ci_phase2"}), encoding="utf-8")
          frame, built_at = service.build_metric_frame()
          required = {"Momentum Score", "Rank", "1M Return", "3M Return", "6M Return", "9M Return", "12M Return", "3M Sharpe", "6M Sharpe", "R² 1Y", "Industry Relative", "Acceleration", "EMA 50", "EMA 100", "EMA 200", "Volume Ratio"}
          missing = sorted(required - set(frame.columns))
          if missing:
              raise RuntimeError(f"Phase 2 metric columns missing: {missing}")
          if len(frame) != 750 or frame["Symbol"].nunique() != 750:
              raise RuntimeError(f"Expected 750 metric rows/symbols, got {len(frame)} rows and {frame['Symbol'].nunique()} symbols")
          if frame["Momentum Score"].notna().sum() < 700:
              raise RuntimeError("Unexpectedly sparse momentum scores")
          print(f"Phase 2 real-data metric build passed: {len(frame)} stocks, built_at={built_at.isoformat()}")
          PY
      - name: Upload Yahoo data test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-10y-history-test
          path: data_cache/yahoo_10y_history_test/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
